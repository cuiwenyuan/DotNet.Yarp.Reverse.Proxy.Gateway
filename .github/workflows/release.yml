name: Release

# 发版触发：推送 v* tag（如 v1.0.0）自动发版；workflow_dispatch 手动触发仅做构建+预检门禁。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------- Job 1：构建门禁（双框架 0 错误 + 配置预检） ----------
  build:
    name: Build & verify (dual TFM)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6 & 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore & build (Release, net6.0 + net8.0)
        run: dotnet build -c Release

      - name: Config precheck (--test-config, equivalent to nginx -t)
        shell: pwsh
        run: |
          dotnet publish src/DotNet.Yarp.Reverse.Proxy.Gateway.Web -c Release -f net8.0 -o "$env:RUNNER_TEMP\precheck"
          dotnet "$env:RUNNER_TEMP\precheck\DotNet.Yarp.Reverse.Proxy.Gateway.Web.dll" --test-config

  # ---------- Job 2：发版（依赖 Job 1 通过；仅 tag 触发时执行） ----------
  release:
    name: Publish & create GitHub Release
    needs: build
    runs-on: windows-latest
    # 新仓库默认 Actions 的 GITHUB_TOKEN 为只读，必须显式声明 contents: write
    # 才能创建 GitHub Release 并上传资产（否则 403 Resource not accessible）。
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6 & 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Compute version from tag
        id: version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^v', ''
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Release version: $ver"

      - name: Publish net8.0 (framework-dependent)
        run: >
          dotnet publish src/DotNet.Yarp.Reverse.Proxy.Gateway.Web
          -c Release -f net8.0 -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/net8.0

      - name: Publish net6.0 (framework-dependent)
        run: >
          dotnet publish src/DotNet.Yarp.Reverse.Proxy.Gateway.Web
          -c Release -f net6.0 -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/net6.0

      - name: Package zip
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "artifacts/net8.0/*" -DestinationPath "gateway-net8.0-v$ver.zip"
          Compress-Archive -Path "artifacts/net6.0/*" -DestinationPath "gateway-net6.0-v$ver.zip"
          Get-ChildItem -Path *.zip | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            gateway-net8.0-v${{ steps.version.outputs.version }}.zip
            gateway-net6.0-v${{ steps.version.outputs.version }}.zip
